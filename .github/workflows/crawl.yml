name: Crawl YES24 salesindex

on:
  schedule:
    # 매일 한국시간(KST, UTC+9) 오전 8시 = UTC 전날 23시
    - cron: "0 23 * * *"
  workflow_dispatch: {}  # Actions 탭에서 수동 실행 버튼도 쓸 수 있게

permissions:
  contents: write  # data.json 커밋하려면 쓰기 권한 필요

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 크롤러 실행
        run: python crawler.py

      - name: data.json 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && echo "변경 없음, 커밋 생략" || git commit -m "chore: update data.json ($(date +'%Y-%m-%d'))"
          git push
